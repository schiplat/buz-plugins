# Pin Dockerfile base images to their current manifest-list digests.
#
# Manual dispatch: resolves every plugins/buz/*/image/Dockerfile FROM tag via
# the registry manifest API and rewrites it as `tag@sha256:<digest>` when the
# digest is missing or moved upstream. Merging the resulting PR changes every
# family's build inputs → the publish workflow rebuilds all families and the
# usual digest-pin PRs follow. Re-run any time to pick up base refreshes.
#
# No image build is triggered by this workflow itself; the `[skip image
# build]` marker keeps the merged PR from fanning out on top of the digest
# builds that the Dockerfile change legitimately starts.
name: pin-base-images

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  pin:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Resolve base digests and rewrite FROM lines
        run: python3 scripts/resolve_base_digests.py

      - name: Open or update the pin PR
        env:
          GH_TOKEN: ${{ secrets.BUZ_PLUGIN_GITHUB_PR_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if git diff --quiet -- 'plugins/*/image/Dockerfile'; then
            echo "All FROM lines already pin current digests — nothing to do."
            exit 0
          fi
          branch="automation/pin-base-images"
          git fetch origin master
          git switch -C "$branch" origin/master
          python3 scripts/resolve_base_digests.py
          git add -A 'plugins/*/image/Dockerfile'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "[skip image build] chore: pin Dockerfile base images to manifest digests"
          if git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null 2>&1; then
            git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"
            expected=$(git rev-parse "refs/remotes/origin/$branch")
          else
            expected=""
          fi
          git push "--force-with-lease=refs/heads/$branch:$expected" origin "HEAD:refs/heads/$branch"
          pr_number=$(gh pr list --repo "$GH_REPO" --state open --head "$branch" --json number --jq '.[0].number // empty')
          pr_body=$(printf 'Pins every Dockerfile base image to the manifest-list digest its tag currently resolves to (deterministic rebuilds; refresh by re-running this workflow).\n\nMerging starts a rebuild of all image families; the usual per-family digest-pin PRs follow.\n\nGenerated by [run %s](%s/%s/actions/runs/%s).' "$GITHUB_RUN_ID" "$GITHUB_SERVER_URL" "$GH_REPO" "$GITHUB_RUN_ID")
          title="[skip image build] Pin Dockerfile base image digests"
          if [[ -n "$pr_number" ]]; then
            gh pr edit "$pr_number" --repo "$GH_REPO" --title "$title" --body "$pr_body"
          else
            gh pr create --repo "$GH_REPO" --base master --head "$branch" --title "$title" --body "$pr_body"
          fi
