name: ci

on:
  push:
    branches: [master]
    # "**" so date-based catalog snapshot tags (2026.10.20) trigger too;
    # v-prefixed tags match as well.
    tags: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    # Fork PRs have no repository secrets and may explicitly skip this step.
    # Trusted pushes and same-repository PRs must have the PAT or fail closed.
    env:
      BUZ_VERSION: ${{ vars.BUZ_VERSION }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Python test dependencies
        run: python3 -m pip install --user pyyaml

      - name: Test Python scripts
        run: python3 tests/test_scripts.py

      - name: Lint shell scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shopt -s nullglob
          files=(scripts/*.sh)
          if [ ${#files[@]} -gt 0 ]; then
            shellcheck "${files[@]}"
          else
            echo "no shell scripts yet — nothing to lint"
          fi

      - name: Lint run blocks (heuristic patterns)
        run: python3 scripts/lint_runs.py plugins

      - name: Check private validator availability
        id: validator-token
        env:
          # Same fallback chain as the buz-plugin install below: any of the
          # three may carry read access to the private schiplat/buz releases.
          GH_TOKEN: ${{ secrets.BUZ_PLUGIN_REPO_TOKEN || secrets.BUZ_REPO_PAT || secrets.BUZ_REPO_PAT_V2 }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Fork PR: private buz-manager validation is skipped; public checks and tests remain required." >&2
          else
            echo "A token with read access to schiplat/buz releases (BUZ_PLUGIN_REPO_TOKEN / BUZ_REPO_PAT / BUZ_REPO_PAT_V2) is required for private buz-manager validation on trusted pushes and internal PRs." >&2
            exit 1
          fi

      - name: Install buz-manager (release binary)
        if: steps.validator-token.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.BUZ_PLUGIN_REPO_TOKEN || secrets.BUZ_REPO_PAT || secrets.BUZ_REPO_PAT_V2 }}
          BUZ_VERSION: ${{ vars.BUZ_VERSION }}
        run: |
          # The authoritative private repo — releases must come from
          # schiplat/buz so validation never runs against a stale binary.
          API="https://api.github.com/repos/schiplat/buz/releases"
          if [ -n "$BUZ_VERSION" ]; then
            RELEASE=$(curl -sfL -H "Authorization: Bearer $GH_TOKEN" "$API/tags/$BUZ_VERSION")
          else
            RELEASE=$(curl -sfL -H "Authorization: Bearer $GH_TOKEN" "$API/latest")
          fi
          ASSET_ID=$(printf '%s' "$RELEASE" | python3 -c 'import sys, json; d = json.load(sys.stdin); print(next(a["id"] for a in d["assets"] if a["name"].endswith("linux-x86_64.tar.gz")))')
          curl -sfL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" -o bundle.tgz "$API/assets/$ASSET_ID"
          tar -xzf bundle.tgz
          sudo install -m 0755 "$(find . -type f -path '*/bin/buz-manager' | head -1)" /usr/local/bin/buz-manager
          buz-manager --version

      - name: Install buz-plugin (release binary)
        if: steps.validator-token.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.BUZ_PLUGIN_REPO_TOKEN || secrets.BUZ_REPO_PAT || secrets.BUZ_REPO_PAT_V2 }}
          BUZ_PLUGIN_VERSION: "2.1.7"
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/buz-plugin"
          mkdir -p "$DIR"
          gh release download "v${BUZ_PLUGIN_VERSION}" \
            --repo schiplat/buz \
            --pattern "buz-plugin-${BUZ_PLUGIN_VERSION}-linux-x86_64.tar.gz" \
            --dir "$DIR"
          tar -xzf "$DIR/buz-plugin-${BUZ_PLUGIN_VERSION}-linux-x86_64.tar.gz" -C "$DIR"
          echo "$DIR" >> "$GITHUB_PATH"
          "$DIR/buz-plugin" --version

      - name: Validate plugin specs
        if: steps.validator-token.outputs.available == 'true'
        run: |
          mapfile -d '' specs < <(find plugins -type d -name '.*' -prune -o -type f \
            \( -name '*.yaml' -o -name '*.yml' \) ! -path '*/.*' -print0 | sort -z)
          if [ ${#specs[@]} -eq 0 ]; then
            echo "No plugin YAML specs found." >&2
            exit 1
          fi
          buz-manager plugin-validate "${specs[@]}"

      - name: Egress report + allowlist check (reviewed baseline)
        run: python3 scripts/egress.py --print --expect egress-allowlist.json

      - name: Validate image release workflow structure
        run: python3 scripts/check_plugin_images.py

      - name: Index and meta drift check (pinned generator)
        # `--check` regenerates in memory and compares every manifest on disk,
        # so stale or missing index/meta files fail with the drifted field
        # named. It writes nothing — the committed copy stays the source.
        if: steps.validator-token.outputs.available == 'true'
        run: buz-plugin index --check

      # index.json advertises versions; reviews.json is what require_reviewed
      # deployments trust. A version in one but not the other (or a review
      # bound to an older hash) makes the catalog ship a template the review
      # gate rejects — the drift this gate exists to catch. Fix it by
      # refreshing the ledger, never by editing hashes.
      - name: Manifest consistency (index ↔ reviews ↔ meta)
        if: steps.validator-token.outputs.available == 'true'
        run: buz-plugin check-manifests --plugins-dir plugins

      - name: Plugin READMEs
        if: steps.validator-token.outputs.available == 'true'
        run: buz-plugin check-readmes --plugins-dir plugins

      - name: Public fork PR validation notice
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true
        run: echo "Private buz-manager validation and the manifest/README gates are skipped for fork PRs because their jobs receive no repository PAT. Public checks and tests remain required."

  # Execution-level shell-compat gate: run the test suite (which executes
  # buz/env-render's run block under /bin/sh) inside the two most restrictive
  # environments a target host might present — debian (sh = dash) and alpine
  # (sh = busybox ash). Static lint cannot catch runtime breakage; this can.
  shell-compat-matrix:
    name: shell compat (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debian (dash)
            image: debian:stable-slim
            deps: apt-get update -qq && apt-get install -y -qq python3 python3-yaml git diffutils
          - name: alpine (ash)
            image: alpine:3.20
            deps: apk add --no-cache python3 py3-yaml git diffutils
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install test dependencies
        run: ${{ matrix.deps }}

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run the env-render run block (/bin/sh execution level)
        # The execution-level gate only needs the run block: every other test is
        # static and platform-independent. Running the whole suite under dash/ash
        # made the matrix 10x slower without adding coverage.
        run: python3 tests/test_scripts.py EnvRenderTests

  build-site:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Record the committed catalog
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        # Publishers sign exactly these bytes. The gate below compares the
        # regenerated catalog against this copy: a pinned tool that cannot
        # reproduce a manifest field (e.g. the `deprecated` overlay) must fail
        # the publish instead of shipping a different catalog for the same tag.
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/committed"
          cp plugins/index.json "$RUNNER_TEMP/committed/index.json"
          cp plugins/revision.json "$RUNNER_TEMP/committed/revision.json"

      - name: Install Node (marketplace site build)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build marketplace site (Vue + Vite)
        run: |
          cd frontend
          npm ci
          npm run build

      # Best-effort: the tool lives in the PRIVATE schiplat/buz release, and a
      # missing credential must not block the site build. Absence is surfaced
      # as a warning annotation and the index is generated unsigned.
      - name: Install buz-plugin
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        id: buz-plugin
        continue-on-error: true
        env:
          # Read access to the PRIVATE schiplat/buz release. Any of the three
          # may carry it depending on how the account is set up, so try them in
          # order: a narrowly scoped plugin token, the account token that is
          # already authorized for the repo, then the validator-mirror token.
          GH_TOKEN: ${{ secrets.BUZ_PLUGIN_REPO_TOKEN || secrets.BUZ_REPO_PAT || secrets.BUZ_REPO_PAT_V2 }}
          # Pinned: a tool release may change the index contract, and that must
          # be a deliberate bump, not a silent follow-the-latest.
          BUZ_PLUGIN_VERSION: "2.1.7"
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/buz-plugin"
          mkdir -p "$DIR"
          gh release download "v${BUZ_PLUGIN_VERSION}" \
            --repo schiplat/buz \
            --pattern "buz-plugin-${BUZ_PLUGIN_VERSION}-linux-x86_64.tar.gz" \
            --dir "$DIR"
          tar -xzf "$DIR/buz-plugin-${BUZ_PLUGIN_VERSION}-linux-x86_64.tar.gz" -C "$DIR"
          echo "$DIR" >> "$GITHUB_PATH"
          echo "available=true" >> "$GITHUB_OUTPUT"
          "$DIR/buz-plugin" --version

      - name: Generate the index
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          set -euo pipefail
          COMMITTED="$RUNNER_TEMP/committed/index.json"
          # Explicit header pins: a publisher never advances the sequence or
          # restamps the catalog. The committed index is the only source, so
          # the site and a release sign the same bytes for the same catalog.
          SEQ="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["sequence"])' "$COMMITTED")"
          AT="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["issued_at"])' "$COMMITTED")"
          if ! command -v buz-plugin >/dev/null 2>&1; then
            if [ "${{ github.ref }}" = "refs/heads/master" ]; then
              echo "::error title=buz-plugin required::the publish path regenerates and signs the catalog with the pinned buz-plugin; bump BUZ_PLUGIN_VERSION or restore the download credential"
              exit 1
            fi
            echo "::warning title=Index not regenerated::buz-plugin unavailable (no credential for the private repo) — the PR preview uses the committed manifests"
            exit 0
          fi
          buz-plugin index --sequence "$SEQ" --updated-at "$AT"

      - name: Fetch the previously published catalog
        id: published
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/published"
          # The newest release other than this ref: a re-run of the same tag
          # must compare against its predecessor, not against itself.
          for tag in $(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=20" --jq '.[].tag_name'); do
            if [ "$tag" = "${GITHUB_REF_NAME}" ]; then
              continue
            fi
            if gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
                --pattern index.json --dir "$RUNNER_TEMP/published" --clobber >/dev/null 2>&1; then
              echo "rollback baseline: $tag" >> "$GITHUB_STEP_SUMMARY"
              echo "path=$RUNNER_TEMP/published/index.json" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "no previously published catalog — no rollback baseline" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the catalog is the committed one
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        # Hard gate on the publish path: a pinned tool that cannot reproduce
        # the committed catalog must stop the deploy, not ship around it.
        env:
          PUBLISHED: ${{ steps.published.outputs.path }}
        run: |
          set -euo pipefail
          args=(--committed "$RUNNER_TEMP/committed/index.json" --generated plugins/index.json --plugins-dir plugins)
          if [ -n "${PUBLISHED:-}" ]; then
            args+=(--published "$PUBLISHED")
          fi
          buz-plugin check-release "${args[@]}"

      # The ledger must be refreshed BEFORE signing: reviews.json.sig covers
      # the refreshed ledger, and a Manager with the trust anchor on refuses
      # an unsigned (or stale-signed) ledger outright.
      - name: Refresh the review ledger
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: buz-plugin reviews --auto --commit "${GITHUB_SHA::7}"

      - name: Sign the index and the review ledger
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          BUZ_PLUGIN_SIGNING_KEY: ${{ secrets.BUZ_PLUGIN_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${BUZ_PLUGIN_SIGNING_KEY:-}" ]; then
            echo "::error title=Signing key missing::the publish path must sign the index and the review ledger"
            exit 1
          fi
          AT="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["issued_at"])' "$RUNNER_TEMP/committed/index.json")"
          SEQ="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["sequence"])' "$RUNNER_TEMP/committed/index.json")"
          umask 077
          KEY="$RUNNER_TEMP/signing-key.json"
          printf '%s' "$BUZ_PLUGIN_SIGNING_KEY" > "$KEY"
          trap 'rm -f "$KEY"' EXIT
          # Re-runs generation at the committed header (byte-identical when the
          # tool reproduces the catalog) and signs index.json AND reviews.json
          # in one pass.
          buz-plugin index --sequence "$SEQ" --updated-at "$AT" --sign-key "$KEY"
          buz-plugin index --check --sequence "$SEQ" --updated-at "$AT" --sign-key "$KEY"

      # Catalog-derived drift sentinel, written LAST (index → meta → revision):
      # a mirror that observes a new revision knows the index beside it is
      # complete. The value depends only on the published (id, version,
      # sha256) triples, so the committed copy and this build always agree —
      # it cannot trail HEAD like a build stamp would.
      - name: Derive the drift sentinel
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          set -euo pipefail
          buz-plugin revision
          if ! cmp -s plugins/revision.json "$RUNNER_TEMP/committed/revision.json"; then
            echo "::error title=Revision drift::revision.json no longer names the committed catalog — the publish must carry the committed manifests, not a re-derivation"
            diff -u "$RUNNER_TEMP/committed/revision.json" plugins/revision.json | head -20 || true
            exit 1
          fi

      - name: Stage deployable directory (site + index + plugin files)
        run: |
          python3 scripts/build_site.py --dist-dir frontend/dist
          python3 scripts/check_site_sources.py

      - name: Upload site artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site-dist
          path: dist/

  deploy-site:
    # Only trusted pushes to master may deploy or write review badges.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: build-site
    permissions:
      contents: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # A PAT (not GITHUB_TOKEN) lets the write-back push through the master
          # ruleset. The reconcile schedule stays as the safety net.
          token: ${{ secrets.BUZ_REPO_PAT_V2 || secrets.BUZ_REPO_PAT || secrets.BUZ_PLUGIN_REPO_TOKEN || github.token }}

      - name: Download site artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site-dist
          path: dist/

      - name: Ensure Pages project exists (first run creates it)
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx wrangler pages project create buz-plugins --production-branch=master || echo "project already exists"

      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=buz-plugins --branch=master --commit-dirty=true

      # The bot push back to master is best-effort: the master ruleset
      # (deletion / non-fast-forward / required checks) blocks GITHUB_TOKEN
      # pushes and Integration bypass is unsupported on personal accounts.
      # The deployed CF Pages dist already carries the refreshed files, so a
      # blocked write-back only delays the git-side copies. That lag is not
      # silent: this step annotates it, and the reconcile-manifests schedule
      # opens a PR with the regenerated manifests (PRs are allowed where
      # pushes are not).
      - name: Commit refreshed manifests
        continue-on-error: true
        run: |
          # build_site stages the manifests under dist/plugins/ (the Manager
          # resolves manifest-relative paths against <site>/plugins/).
          cp dist/plugins/reviews.json plugins/reviews.json
          cp dist/plugins/revision.json plugins/revision.json
          cp dist/plugins/index.json plugins/index.json
          MANIFESTS="plugins/reviews.json plugins/revision.json plugins/index.json"
          if [ -f dist/plugins/index.json.sig ]; then
            cp dist/plugins/index.json.sig plugins/index.json.sig
            MANIFESTS="$MANIFESTS plugins/index.json.sig"
          fi
          if [ -f dist/plugins/reviews.json.sig ]; then
            cp dist/plugins/reviews.json.sig plugins/reviews.json.sig
            MANIFESTS="$MANIFESTS plugins/reviews.json.sig"
          fi
          if git diff --quiet -- $MANIFESTS; then
            echo "reviews.json unchanged — nothing to commit"
          else
            git config user.name "buz-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- $MANIFESTS
            git commit -m "ci: refresh official review badges [skip ci]"
            # Parallel runs (badge refreshes, pin merges) move master while this
            # job runs, and both sides regenerate the same file with different
            # badge shas — a true rebase conflict. Resolve it by taking the
            # remote state: the file is fully derived from the specs, so any
            # regenerated version is equivalent and the next run re-badges.
            if ! git pull --rebase -X ours origin "${GITHUB_REF_NAME}"; then
              git rebase --abort
              git pull --rebase -X ours origin "${GITHUB_REF_NAME}"
            fi
            if git push; then
              echo "manifest write-back pushed to ${GITHUB_REF_NAME}" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning title=Manifest write-back blocked::the deployed site is current; the git copies lag until reconcile-manifests opens a refresh PR"
              {
                echo ""
                echo "**Manifest write-back blocked.** The deployed site carries the refreshed"
                echo "manifests; the git copies will be re-synced by the \`reconcile-manifests\`"
                echo "schedule (it opens a PR, which the ruleset permits)."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

  release-index:
    # Catalog snapshot tags are date-based (2026.10.16), not v-prefixed —
    # match every tag so each snapshot actually gets its index.json asset.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Record the committed catalog
        # This job signs `plugins/index.json`, never a re-derivation of it.
        # The copy is kept so the gate can prove the pinned tool reproduced
        # the committed catalog field for field before anything is signed.
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/committed"
          cp plugins/index.json "$RUNNER_TEMP/committed/index.json"
          cp plugins/revision.json "$RUNNER_TEMP/committed/revision.json"

      - name: Install buz-plugin
        env:
          GH_TOKEN: ${{ secrets.BUZ_PLUGIN_REPO_TOKEN || secrets.BUZ_REPO_PAT || secrets.BUZ_REPO_PAT_V2 }}
          # Pinned: a tool release may change the index contract, and that must
          # be a deliberate bump, not a silent follow-the-latest. A pin that
          # cannot reproduce the committed catalog fails the gate below.
          BUZ_PLUGIN_VERSION: "2.1.7"
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/buz-plugin"
          mkdir -p "$DIR"
          gh release download "v${BUZ_PLUGIN_VERSION}" \
            --repo schiplat/buz \
            --pattern "buz-plugin-${BUZ_PLUGIN_VERSION}-linux-x86_64.tar.gz" \
            --dir "$DIR"
          tar -xzf "$DIR/buz-plugin-${BUZ_PLUGIN_VERSION}-linux-x86_64.tar.gz" -C "$DIR"
          echo "$DIR" >> "$GITHUB_PATH"
          "$DIR/buz-plugin" --version

      - name: Fetch the previously published catalog
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/published"
          # The newest release other than this ref: a re-run of the same tag
          # must compare against its predecessor, not against itself.
          for tag in $(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=20" --jq '.[].tag_name'); do
            if [ "$tag" = "${GITHUB_REF_NAME}" ]; then
              continue
            fi
            if gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
                --pattern index.json --dir "$RUNNER_TEMP/published" --clobber >/dev/null 2>&1; then
              echo "rollback baseline: $tag" >> "$GITHUB_STEP_SUMMARY"
              echo "path=$RUNNER_TEMP/published/index.json" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "no previously published catalog — no rollback baseline" >> "$GITHUB_STEP_SUMMARY"

      - name: Generate, verify, and sign index.json
        env:
          BUZ_PLUGIN_SIGNING_KEY: ${{ secrets.BUZ_PLUGIN_SIGNING_KEY }}
          PUBLISHED: ${{ steps.published.outputs.path }}
        run: |
          set -euo pipefail
          COMMITTED="$RUNNER_TEMP/committed/index.json"
          SEQ="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["sequence"])' "$COMMITTED")"
          AT="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["issued_at"])' "$COMMITTED")"
          umask 077
          KEY="$RUNNER_TEMP/signing-key.json"
          printf '%s' "$BUZ_PLUGIN_SIGNING_KEY" > "$KEY"
          trap 'rm -f "$KEY"' EXIT
          # Generate unsigned first: the gate must see the bytes before any
          # signature exists, so a divergent catalog is never signed. The
          # explicit header pins make an implicit sequence advance impossible.
          buz-plugin index --sequence "$SEQ" --updated-at "$AT"
          args=(--committed "$COMMITTED" --generated plugins/index.json --plugins-dir plugins)
          if [ -n "${PUBLISHED:-}" ]; then
            args+=(--published "$PUBLISHED")
          fi
          buz-plugin check-release "${args[@]}"
          # Signs index.json AND the committed reviews.json in one pass.
          buz-plugin index --sequence "$SEQ" --updated-at "$AT" --sign-key "$KEY"
          buz-plugin index --check --sequence "$SEQ" --updated-at "$AT" --sign-key "$KEY"
          # Snapshot self-consistency: the sentinel must name this catalog.
          buz-plugin revision
          if ! cmp -s plugins/revision.json "$RUNNER_TEMP/committed/revision.json"; then
            echo "::error title=Revision drift::revision.json no longer names the committed catalog — publish the committed manifests, not a re-derivation"
            diff -u "$RUNNER_TEMP/committed/revision.json" plugins/revision.json | head -20 || true
            exit 1
          fi

      - name: Attach index.json to the release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
