name: ci

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    # Validator comes from the buz release assets (no Rust toolchain here).
    # buz is private — downloading its release assets needs a PAT with read
    # access to schiplat/buz (`BUZ_REPO_PAT_V2` secret). Without it, only lint
    # runs and step-validate is skipped.
    # Optional version pin: repo variable BUZ_VERSION (e.g. v1.5.7).
    # Empty → latest release.
    env:
      BUZ_REPO_PAT_V2: ${{ secrets.BUZ_REPO_PAT_V2 }}
      BUZ_VERSION: ${{ vars.BUZ_VERSION }}
    steps:
      - uses: actions/checkout@v4

      - name: Lint shell scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shopt -s nullglob
          files=(scripts/*.sh)
          if [ ${#files[@]} -gt 0 ]; then
            shellcheck "${files[@]}"
          else
            echo "no shell scripts yet — nothing to lint"
          fi

      - name: Lint run blocks (heuristic patterns)
        run: python3 scripts/lint_runs.py plugins

      - name: Install buz-manager (release binary)
        if: env.BUZ_REPO_PAT_V2 != ''
        env:
          GH_TOKEN: ${{ secrets.BUZ_REPO_PAT_V2 }}
        run: |
          API="https://api.github.com/repos/schiplatv2/buz/releases"
          if [ -n "$BUZ_VERSION" ]; then
            RELEASE=$(curl -sfL -H "Authorization: Bearer $GH_TOKEN" "$API/tags/$BUZ_VERSION")
          else
            RELEASE=$(curl -sfL -H "Authorization: Bearer $GH_TOKEN" "$API/latest")
          fi
          # Private repo: browser_download_url only accepts browser sessions —
          # asset downloads go through the API endpoint (octet-stream + token).
          ASSET_ID=$(printf '%s' "$RELEASE" | python3 -c 'import sys, json; d = json.load(sys.stdin); print(next(a["id"] for a in d["assets"] if a["name"].endswith("linux-x86_64.tar.gz")))')
          curl -sfL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" -o bundle.tgz "$API/assets/$ASSET_ID"
          tar -xzf bundle.tgz
          sudo install -m 0755 "$(find . -type f -path '*/bin/buz-manager' | head -1)" /usr/local/bin/buz-manager
          buz-manager --version

      - name: Validate step specs
        if: env.BUZ_REPO_PAT_V2 != ''
        run: buz-manager step-validate plugins

      - name: Generate index (dry run)
        run: python3 scripts/gen_index.py --output /tmp/index.json && head /tmp/index.json

  site:
    runs-on: ubuntu-latest
    needs: validate
    # `secrets` is not readable in step-level `if:` — map it to env here and
    # gate the deploy on the env value instead.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node (marketplace site build)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Build marketplace site (Vue + Vite)
        run: |
          cd website
          npm ci
          npm run build

      - name: Stage deployable directory (site + index + plugin files)
        run: |
          pip install pyyaml
          python3 scripts/gen_index.py --output index.json
          python3 scripts/build_site.py --dist-dir website/dist

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/

      # Deploys on pushes to master once the secrets exist (repo Settings →
      # Secrets and variables → Actions):
      #   CLOUDFLARE_API_TOKEN  — CF token with "Cloudflare Pages: Edit"
      #   CLOUDFLARE_ACCOUNT_ID — CF account id
      # Custom domain (plugins.buz.schiplat.com) is bound in the CF Pages
      # project settings after the first deploy creates the project.
      - name: Ensure Pages project exists (first run creates it)
        if: github.ref == 'refs/heads/master' && env.CLOUDFLARE_API_TOKEN != ''
        run: |
          npx wrangler pages project create buz-plugins --production-branch=master             || echo "project already exists"

      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/master' && env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        env:
          WRANGLER_LOG: debug
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=buz-plugins --branch=master --commit-dirty=true

  index:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Generate index.json
        run: python3 scripts/gen_index.py --output index.json

      - name: Attach index.json to the release
        uses: softprops/action-gh-release@v2
        with:
          files: index.json
