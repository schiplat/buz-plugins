name: ci

on:
  push:
    branches: [master]
    # "**" so date-based catalog snapshot tags (2026.10.20) trigger too;
    # v-prefixed tags match as well.
    tags: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    # Fork PRs have no repository secrets and may explicitly skip this step.
    # Trusted pushes and same-repository PRs must have the PAT or fail closed.
    env:
      BUZ_VERSION: ${{ vars.BUZ_VERSION }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Python test dependencies
        run: python3 -m pip install --user pyyaml

      - name: Test Python scripts
        run: python3 tests/test_scripts.py

      - name: Lint shell scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shopt -s nullglob
          files=(scripts/*.sh)
          if [ ${#files[@]} -gt 0 ]; then
            shellcheck "${files[@]}"
          else
            echo "no shell scripts yet — nothing to lint"
          fi

      - name: Lint run blocks (heuristic patterns)
        run: python3 scripts/lint_runs.py plugins

      - name: Check plugin READMEs
        run: python3 scripts/check_plugin_readmes.py plugins

      - name: Check private validator availability
        id: validator-token
        env:
          # Same fallback chain as the buz-plugin install below: any of the
          # three may carry read access to the private schiplat/buz releases.
          GH_TOKEN: ${{ secrets.BUZ_PLUGIN_REPO_TOKEN || secrets.BUZ_REPO_PAT || secrets.BUZ_REPO_PAT_V2 }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Fork PR: private buz-manager validation is skipped; public checks and tests remain required." >&2
          else
            echo "A token with read access to schiplat/buz releases (BUZ_PLUGIN_REPO_TOKEN / BUZ_REPO_PAT / BUZ_REPO_PAT_V2) is required for private buz-manager validation on trusted pushes and internal PRs." >&2
            exit 1
          fi

      - name: Install buz-manager (release binary)
        if: steps.validator-token.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.BUZ_PLUGIN_REPO_TOKEN || secrets.BUZ_REPO_PAT || secrets.BUZ_REPO_PAT_V2 }}
          BUZ_VERSION: ${{ vars.BUZ_VERSION }}
        run: |
          # The authoritative private repo — releases must come from
          # schiplat/buz so validation never runs against a stale binary.
          API="https://api.github.com/repos/schiplat/buz/releases"
          if [ -n "$BUZ_VERSION" ]; then
            RELEASE=$(curl -sfL -H "Authorization: Bearer $GH_TOKEN" "$API/tags/$BUZ_VERSION")
          else
            RELEASE=$(curl -sfL -H "Authorization: Bearer $GH_TOKEN" "$API/latest")
          fi
          ASSET_ID=$(printf '%s' "$RELEASE" | python3 -c 'import sys, json; d = json.load(sys.stdin); print(next(a["id"] for a in d["assets"] if a["name"].endswith("linux-x86_64.tar.gz")))')
          curl -sfL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" -o bundle.tgz "$API/assets/$ASSET_ID"
          tar -xzf bundle.tgz
          sudo install -m 0755 "$(find . -type f -path '*/bin/buz-manager' | head -1)" /usr/local/bin/buz-manager
          buz-manager --version

      - name: Validate plugin specs
        if: steps.validator-token.outputs.available == 'true'
        run: |
          mapfile -d '' specs < <(find plugins -type d -name '.*' -prune -o -type f \
            \( -name '*.yaml' -o -name '*.yml' \) ! -path '*/.*' -print0 | sort -z)
          if [ ${#specs[@]} -eq 0 ]; then
            echo "No plugin YAML specs found." >&2
            exit 1
          fi
          buz-manager plugin-validate "${specs[@]}"

      - name: Egress report + allowlist check (reviewed baseline)
        run: python3 scripts/egress.py --print --expect egress-allowlist.json

      - name: Validate image release workflow structure
        run: python3 scripts/check_plugin_images.py

      - name: Generate index (dry run)
        run: python3 scripts/gen_index.py && test -f plugins/index.json

      - name: Public fork PR validation notice
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true
        run: echo "Private buz-manager validation is skipped for fork PRs because their jobs receive no repository PAT."

  build-site:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Node (marketplace site build)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build marketplace site (Vue + Vite)
        run: |
          cd frontend
          npm ci
          npm run build

      # Best-effort: the tool lives in the PRIVATE schiplat/buz release, and a
      # missing credential must not block the site build. Absence is surfaced
      # as a warning annotation and the index is generated unsigned.
      - name: Install buz-plugin
        id: buz-plugin
        continue-on-error: true
        env:
          # Read access to the PRIVATE schiplat/buz release. Any of the three
          # may carry it depending on how the account is set up, so try them in
          # order: a narrowly scoped plugin token, the account token that is
          # already authorized for the repo, then the validator-mirror token.
          GH_TOKEN: ${{ secrets.BUZ_PLUGIN_REPO_TOKEN || secrets.BUZ_REPO_PAT || secrets.BUZ_REPO_PAT_V2 }}
          # Pinned: a tool release may change the index contract, and that must
          # be a deliberate bump, not a silent follow-the-latest.
          BUZ_PLUGIN_VERSION: "1.12.0"
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/buz-plugin"
          mkdir -p "$DIR"
          gh release download "v${BUZ_PLUGIN_VERSION}" \
            --repo schiplat/buz \
            --pattern "buz-plugin-${BUZ_PLUGIN_VERSION}-linux-x86_64.tar.gz" \
            --dir "$DIR"
          tar -xzf "$DIR/buz-plugin-${BUZ_PLUGIN_VERSION}-linux-x86_64.tar.gz" -C "$DIR"
          echo "$DIR" >> "$GITHUB_PATH"
          echo "available=true" >> "$GITHUB_OUTPUT"
          "$DIR/buz-plugin" --version

      - name: Generate the index
        run: |
          set -euo pipefail
          REV="${GITHUB_SHA}"
          AT="$(git log -1 --format=%cI)"
          if ! command -v buz-plugin >/dev/null 2>&1; then
            echo "::warning title=Index unsigned::buz-plugin unavailable (no credential for the private repo) - falling back to scripts/gen_index.py"
            python3 scripts/gen_index.py --revision "$REV" --updated-at "$AT"
            exit 0
          fi
          buz-plugin index --revision "$REV" --updated-at "$AT"

      # The ledger must be refreshed BEFORE signing: reviews.json.sig covers
      # the refreshed ledger, and a Manager with the trust anchor on refuses
      # an unsigned (or stale-signed) ledger outright.
      - name: Refresh the review ledger
        run: |
          pip install pyyaml
          python3 scripts/gen_reviews.py --auto --commit "${GITHUB_SHA::7}"

      - name: Sign the index and the review ledger
        env:
          BUZ_PLUGIN_SIGNING_KEY: ${{ secrets.BUZ_PLUGIN_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if ! command -v buz-plugin >/dev/null 2>&1; then
            echo "::warning title=Index unsigned::buz-plugin unavailable — index and review ledger are published unsigned"
            exit 0
          fi
          if [ -z "${BUZ_PLUGIN_SIGNING_KEY:-}" ]; then
            # Fork PRs receive no secrets; the manifests still have to be valid.
            echo "::warning title=Index unsigned::signing key unavailable (fork PR?) — index and review ledger are published unsigned"
            exit 0
          fi
          REV="${GITHUB_SHA}"
          AT="$(git log -1 --format=%cI)"
          umask 077
          KEY="$RUNNER_TEMP/signing-key.json"
          printf '%s' "$BUZ_PLUGIN_SIGNING_KEY" > "$KEY"
          trap 'rm -f "$KEY"' EXIT
          # Re-runs generation (byte-identical for unchanged entries) and
          # signs index.json AND reviews.json in one pass.
          buz-plugin index --revision "$REV" --updated-at "$AT" --sign-key "$KEY"
          buz-plugin index --check --revision "$REV" --updated-at "$AT" --sign-key "$KEY"

      - name: Stage deployable directory (site + index + plugin files)
        run: |
          python3 scripts/build_site.py --dist-dir frontend/dist
          python3 scripts/check_site_sources.py

      - name: Upload site artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site-dist
          path: dist/

  deploy-site:
    # Only trusted pushes to master may deploy or write review badges.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: build-site
    permissions:
      contents: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download site artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site-dist
          path: dist/

      - name: Ensure Pages project exists (first run creates it)
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx wrangler pages project create buz-plugins --production-branch=master || echo "project already exists"

      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=buz-plugins --branch=master --commit-dirty=true

      # The bot push back to master is best-effort: the master ruleset
      # (deletion / non-fast-forward / required checks) blocks GITHUB_TOKEN
      # pushes and Integration bypass is unsupported on personal accounts.
      # The deployed CF Pages dist already carries the refreshed file, so a
      # blocked repo write-back only delays the git-side sync until the next
      # human PR.
      - name: Commit refreshed reviews.json
        continue-on-error: true
        run: |
          # build_site stages the manifests under dist/plugins/ (the Manager
          # resolves manifest-relative paths against <site>/plugins/).
          cp dist/plugins/reviews.json plugins/reviews.json
          cp dist/plugins/revision.json plugins/revision.json
          cp dist/plugins/index.json plugins/index.json
          MANIFESTS="plugins/reviews.json plugins/revision.json plugins/index.json"
          if [ -f dist/plugins/index.json.sig ]; then
            cp dist/plugins/index.json.sig plugins/index.json.sig
            MANIFESTS="$MANIFESTS plugins/index.json.sig"
          fi
          if [ -f dist/plugins/reviews.json.sig ]; then
            cp dist/plugins/reviews.json.sig plugins/reviews.json.sig
            MANIFESTS="$MANIFESTS plugins/reviews.json.sig"
          fi
          if git diff --quiet -- $MANIFESTS; then
            echo "reviews.json unchanged — nothing to commit"
          else
            git config user.name "buz-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- $MANIFESTS
            git commit -m "ci: refresh official review badges [skip ci]"
            # Parallel runs (badge refreshes, pin merges) move master while this
            # job runs, and both sides regenerate the same file with different
            # badge shas — a true rebase conflict. Resolve it by taking the
            # remote state: the file is fully derived from the specs, so any
            # regenerated version is equivalent and the next run re-badges.
            if ! git pull --rebase -X ours origin "${GITHUB_REF_NAME}"; then
              git rebase --abort
              git pull --rebase -X ours origin "${GITHUB_REF_NAME}"
            fi
            git push
          fi

  release-index:
    # Catalog snapshot tags are date-based (2026.10.16), not v-prefixed —
    # match every tag so each snapshot actually gets its index.json asset.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install buz-plugin
        env:
          GH_TOKEN: ${{ secrets.BUZ_PLUGIN_REPO_TOKEN || secrets.BUZ_REPO_PAT || secrets.BUZ_REPO_PAT_V2 }}
          BUZ_PLUGIN_VERSION: "1.12.0"
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/buz-plugin"
          mkdir -p "$DIR"
          gh release download "v${BUZ_PLUGIN_VERSION}" \
            --repo schiplat/buz \
            --pattern "buz-plugin-${BUZ_PLUGIN_VERSION}-linux-x86_64.tar.gz" \
            --dir "$DIR"
          tar -xzf "$DIR/buz-plugin-${BUZ_PLUGIN_VERSION}-linux-x86_64.tar.gz" -C "$DIR"
          echo "$DIR" >> "$GITHUB_PATH"
          "$DIR/buz-plugin" --version

      - name: Generate and sign index.json
        env:
          BUZ_PLUGIN_SIGNING_KEY: ${{ secrets.BUZ_PLUGIN_SIGNING_KEY }}
        run: |
          set -euo pipefail
          REV="${GITHUB_SHA}"
          AT="$(git log -1 --format=%cI)"
          umask 077
          KEY="$RUNNER_TEMP/signing-key.json"
          printf '%s' "$BUZ_PLUGIN_SIGNING_KEY" > "$KEY"
          trap 'rm -f "$KEY"' EXIT
          # Signs index.json AND the committed reviews.json in one pass.
          buz-plugin index --revision "$REV" --updated-at "$AT" --sign-key "$KEY"
          buz-plugin index --check --revision "$REV" --updated-at "$AT" --sign-key "$KEY"

      - name: Attach index.json to the release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          files: |
            plugins/index.json
            plugins/index.json.sig
            plugins/reviews.json
            plugins/reviews.json.sig
