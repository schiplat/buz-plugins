name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint shell scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shopt -s nullglob
          files=(scripts/*.sh)
          if [ ${#files[@]} -gt 0 ]; then
            shellcheck "${files[@]}"
          else
            echo "no shell scripts yet — nothing to lint"
          fi

      - name: Install Rust (build buz-manager for step-validate)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: buz

      - name: Checkout buz (validator source)
        uses: actions/checkout@v4
        with:
          repository: schiplat/buz
          ref: main
          path: buz

      - name: Build buz-manager
        run: cargo build --locked --release -p manager
        working-directory: buz

      - name: Lint run blocks (heuristic patterns)
        run: python3 scripts/lint_runs.py plugins

      - name: Validate step specs
        run: ./buz/target/release/buz-manager step-validate plugins

      - name: Generate index (dry run)
        run: python3 scripts/gen_index.py --output /tmp/index.json && head /tmp/index.json

  site:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Build site bundle (site-data + index + plugin files)
        run: |
          pip install pyyaml
          python3 scripts/gen_index.py --output index.json
          python3 scripts/build_site.py
          cp index.json reviews.json site/ 2>/dev/null || cp index.json site/

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/

      # TODO(plugins.buz.schiplat.com): wire the deploy once the domain and
      # host are confirmed — the artifact above IS the deployable directory
      # (site/ + index.json + plugins/ + reviews.json):
      #   Cloudflare Pages: direct upload (wrangler-action) or connect repo
      #   GitHub Pages: actions/deploy-pages with the same artifact

  index:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Generate index.json
        run: python3 scripts/gen_index.py --output index.json

      - name: Attach index.json to the release
        uses: softprops/action-gh-release@v2
        with:
          files: index.json
