name: Publish plugin tool image

on:
  push:
    branches:
      - master
    paths:
      - plugins/buz/oss-upload/image/**
      - plugins/buz/oss-upload/*.yaml
      - plugins/buz/oss-upload/*.yml
      - plugins/buz/s3-upload/image/**
      - plugins/buz/s3-upload/*.yaml
      - plugins/buz/s3-upload/*.yml
      - plugins/buz/setup-rust/image/**
      - plugins/buz/setup-rust/*.yaml
      - plugins/buz/setup-rust/*.yml
      - plugins/buz/setup-ruby/image/**
      - plugins/buz/setup-ruby/*.yaml
      - plugins/buz/setup-ruby/*.yml
      - plugins/buz/setup-php/image/**
      - plugins/buz/setup-php/*.yaml
      - plugins/buz/setup-php/*.yml
      - plugins/buz/setup-lua/image/**
      - plugins/buz/setup-lua/*.yaml
      - plugins/buz/setup-lua/*.yml
      - plugins/buz/setup-python/image/**
      - plugins/buz/setup-python/*.yaml
      - plugins/buz/setup-python/*.yml
      - plugins/buz/setup-node/image/**
      - plugins/buz/setup-node/*.yaml
      - plugins/buz/setup-node/*.yml
      - plugins/buz/setup-java/image/**
      - plugins/buz/setup-java/*.yaml
      - plugins/buz/setup-java/*.yml
      - plugins/buz/setup-go/image/**
      - plugins/buz/setup-go/*.yaml
      - plugins/buz/setup-go/*.yml

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      families: ${{ steps.select.outputs.families }}
      versions: ${{ steps.select.outputs.versions }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Select changed image families
        id: select
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: python3 scripts/select_plugin_image_families.py --before "$BEFORE_SHA" --after "$AFTER_SHA"

  publish:
    needs: detect
    if: needs.detect.outputs.families != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image_family: ${{ fromJSON(needs.detect.outputs.families) }}
    concurrency:
      group: publish-plugin-image-${{ matrix.image_family }}-${{ github.run_id }}-${{ github.run_attempt }}
      cancel-in-progress: false
    steps:
      - name: Validate push and resolve image context
        id: image
        env:
          IMAGE_FAMILY: ${{ matrix.image_family }}
          IMAGE_VERSION: ${{ fromJSON(needs.detect.outputs.versions)[matrix.image_family] }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "Images may only be published from master." >&2
            exit 1
          fi
          if [[ ! "$IMAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be a semantic X.Y.Z tag." >&2
            exit 1
          fi
          if [[ ! "$GITHUB_RUN_NUMBER" =~ ^[0-9]+$ || ! "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]; then
            echo "GitHub run number and attempt must be numeric." >&2
            exit 1
          fi
          case "$IMAGE_FAMILY" in
            oss-tools)
              image="docker.io/schiplat/buz-plugins-oss-tools"
              context="plugins/buz/oss-upload/image"
              ;;
            aws-tools)
              image="docker.io/schiplat/buz-plugins-aws-tools"
              context="plugins/buz/s3-upload/image"
              ;;
            rust-tools)
              image="docker.io/schiplat/buz-plugins-rust-tools"
              context="plugins/buz/setup-rust/image"
              ;;
            ruby-tools)
              image="docker.io/schiplat/buz-plugins-ruby-tools"
              context="plugins/buz/setup-ruby/image"
              ;;
            php-tools)
              image="docker.io/schiplat/buz-plugins-php-tools"
              context="plugins/buz/setup-php/image"
              ;;
            lua-tools)
              image="docker.io/schiplat/buz-plugins-lua-tools"
              context="plugins/buz/setup-lua/image"
              ;;
            python-tools)
              image="docker.io/schiplat/buz-plugins-python-tools"
              context="plugins/buz/setup-python/image"
              ;;
            node-tools)
              image="docker.io/schiplat/buz-plugins-node-tools"
              context="plugins/buz/setup-node/image"
              ;;
            java-tools)
              image="docker.io/schiplat/buz-plugins-java-tools"
              context="plugins/buz/setup-java/image"
              ;;
            go-tools)
              image="docker.io/schiplat/buz-plugins-go-tools"
              context="plugins/buz/setup-go/image"
              ;;
            *)
              echo "Unsupported image family." >&2
              exit 1
              ;;
          esac
          tag_version="${IMAGE_VERSION}-build.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "context=$context" >> "$GITHUB_OUTPUT"
          echo "tag=$image:$tag_version" >> "$GITHUB_OUTPUT"
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db # v3.6.1

      - name: Log in to Docker Hub
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Reject an existing image version tag
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          set -euo pipefail
          error_file=$(mktemp)
          trap 'rm -f "$error_file"' EXIT
          if docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>"$error_file"; then
            echo "Refusing to overwrite existing image tag $IMAGE:$VERSION" >&2
            exit 1
          fi
          if grep -Eiq 'manifest unknown|no such manifest|(^|: )not found($|[[:space:]])|status code: 404' "$error_file"; then
            echo "Image tag does not exist; continuing with $IMAGE:$VERSION"
          else
            echo "Could not determine whether image tag exists; refusing to publish." >&2
            cat "$error_file" >&2
            exit 1
          fi

      - name: Build and publish Linux x86_64 image
        id: build
        uses: docker/build-push-action@1ca370b3a9802c92e886402e0dd88098a2533b12 # v6.4.1
        with:
          context: ${{ steps.image.outputs.context }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tag }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=plugin-${{ matrix.image_family }}
          cache-to: type=gha,mode=max,scope=plugin-${{ matrix.image_family }}

      - name: Record published image digest
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Build action did not return an image digest." >&2
            exit 1
          fi
          echo "Published \\`${IMAGE}@${DIGEST}\\`" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p "$RUNNER_TEMP/plugin-image-digest"
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/plugin-image-digest/digest.txt"
          echo "manifest_digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Upload published digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: plugin-image-digest-${{ matrix.image_family }}
          path: ${{ runner.temp }}/plugin-image-digest/digest.txt
          if-no-files-found: error
          retention-days: 1

  pin-template:
    needs: [detect, publish]
    if: github.ref == 'refs/heads/master' && always() && needs.detect.result == 'success' && needs.detect.outputs.families != '[]' && needs.publish.result != 'cancelled'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image_family: ${{ fromJSON(needs.detect.outputs.families) }}
    concurrency:
      group: pin-plugin-image-${{ matrix.image_family }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.BUZ_PLUGIN_GITHUB_PR_TOKEN || github.token }}

      - name: Install pin script dependencies
        run: python3 -m pip install --user pyyaml

      - name: Download published digest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: plugin-image-digest-${{ matrix.image_family }}
          path: ${{ runner.temp }}/plugin-image-digest
        continue-on-error: true

      - name: Prepare template update
        id: update
        env:
          IMAGE_FAMILY: ${{ matrix.image_family }}
        run: |
          set -euo pipefail
          digest_file="$RUNNER_TEMP/plugin-image-digest/digest.txt"
          if [[ ! -s "$digest_file" ]]; then
            echo "No successful image build artifact for $IMAGE_FAMILY; nothing to pin."
            echo "No published digest artifact was available for $IMAGE_FAMILY." >> "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          digest=$(<"$digest_file")
          branch="automation/pin-${IMAGE_FAMILY}"
          git fetch origin master
          git switch -C "$branch" origin/master
          python3 scripts/pin_plugin_image.py --family "$IMAGE_FAMILY" --digest "$digest"
          case "$IMAGE_FAMILY" in
            oss-tools) plugin_dir=plugins/buz/oss-upload ;;
            aws-tools) plugin_dir=plugins/buz/s3-upload ;;
            rust-tools) plugin_dir=plugins/buz/setup-rust ;;
            ruby-tools) plugin_dir=plugins/buz/setup-ruby ;;
            php-tools) plugin_dir=plugins/buz/setup-php ;;
            lua-tools) plugin_dir=plugins/buz/setup-lua ;;
            python-tools) plugin_dir=plugins/buz/setup-python ;;
            node-tools) plugin_dir=plugins/buz/setup-node ;;
            java-tools) plugin_dir=plugins/buz/setup-java ;;
            go-tools) plugin_dir=plugins/buz/setup-go ;;
            *) echo "Unsupported image family." >&2; exit 1 ;;
          esac
          if git status --porcelain -- "$plugin_dir" | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update digest pin pull request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BUZ_PLUGIN_GITHUB_PR_TOKEN || github.token }}
          IMAGE_FAMILY: ${{ matrix.image_family }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          case "$IMAGE_FAMILY" in
            oss-tools)
              plugin_dir=plugins/buz/oss-upload
              title="[skip image build] Pin OSS upload image digest"
              ;;
            aws-tools)
              plugin_dir=plugins/buz/s3-upload
              title="[skip image build] Pin S3 upload image digest"
              ;;
            rust-tools)
              plugin_dir=plugins/buz/setup-rust
              title="[skip image build] Pin Rust toolchain image digest"
              ;;
            ruby-tools)
              plugin_dir=plugins/buz/setup-ruby
              title="[skip image build] Pin Ruby toolchain image digest"
              ;;
            php-tools)
              plugin_dir=plugins/buz/setup-php
              title="[skip image build] Pin PHP toolchain image digest"
              ;;
            lua-tools)
              plugin_dir=plugins/buz/setup-lua
              title="[skip image build] Pin Lua toolchain image digest"
              ;;
            python-tools)
              plugin_dir=plugins/buz/setup-python
              title="[skip image build] Pin Python toolchain image digest"
              ;;
            node-tools)
              plugin_dir=plugins/buz/setup-node
              title="[skip image build] Pin Node.js toolchain image digest"
              ;;
            java-tools)
              plugin_dir=plugins/buz/setup-java
              title="[skip image build] Pin Java toolchain image digest"
              ;;
            go-tools)
              plugin_dir=plugins/buz/setup-go
              title="[skip image build] Pin Go toolchain image digest"
              ;;
            *) echo "Unsupported image family." >&2; exit 1 ;;
          esac
          branch="automation/pin-${IMAGE_FAMILY}"
          git fetch origin master
          git switch -C "$branch" origin/master
          python3 scripts/pin_plugin_image.py --family "$IMAGE_FAMILY" --digest "$(<"$RUNNER_TEMP/plugin-image-digest/digest.txt")"
          git add -A "$plugin_dir"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "[skip image build] chore: pin ${IMAGE_FAMILY} image digest"
          if git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null 2>&1; then
            git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"
            expected=$(git rev-parse "refs/remotes/origin/$branch")
          else
            expected=""
          fi
          git push "--force-with-lease=refs/heads/$branch:$expected" origin "HEAD:refs/heads/$branch"
          pr_number=$(gh pr list --repo "$GH_REPO" --state open --head "$branch" --json number --jq '.[0].number // empty')
          pr_body=$(printf 'This PR pins the successfully published %s image to its immutable manifest digest.\n\nGenerated by [image publish run %s](%s/%s/actions/runs/%s).' "$IMAGE_FAMILY" "$GITHUB_RUN_ID" "$GITHUB_SERVER_URL" "$GH_REPO" "$GITHUB_RUN_ID")
          if [[ -n "$pr_number" ]]; then
            gh pr edit "$pr_number" --repo "$GH_REPO" --title "$title" --body "$pr_body"
          else
            gh pr create --repo "$GH_REPO" --base master --head "$branch" --title "$title" --body "$pr_body"
          fi
