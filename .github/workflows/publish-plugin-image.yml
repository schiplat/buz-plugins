name: Publish plugin tool image

on:
  push:
    branches:
      - master
    paths:
      - plugins/buz/oss-upload/image/**
      - plugins/buz/s3-upload/image/**
  workflow_dispatch:
    inputs:
      image_family:
        description: Tool image to publish
        required: true
        type: choice
        options:
          - oss-tools
          - aws-tools
      version:
        description: Immutable image release tag (X.Y.Z)
        required: true
        type: string

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      families: ${{ steps.select.outputs.families }}
      version: ${{ steps.select.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Select changed image families
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          IMAGE_FAMILY: ${{ inputs.image_family }}
          IMAGE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          families=()
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            case "$IMAGE_FAMILY" in
              oss-tools|aws-tools) families+=("$IMAGE_FAMILY") ;;
              *) echo "Unsupported image family." >&2; exit 1 ;;
            esac
            version="$IMAGE_VERSION"
          else
            if [[ ! "$BEFORE_SHA" =~ ^0+$ ]]; then
              changed_files=$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA")
            else
              changed_files=$(git diff-tree --root --no-commit-id --name-only -r "$GITHUB_SHA")
            fi
            while IFS= read -r file; do
              case "$file" in
                plugins/buz/oss-upload/image/*) families+=(oss-tools) ;;
                plugins/buz/s3-upload/image/*) families+=(aws-tools) ;;
              esac
            done <<< "$changed_files"
            version="1.0.${GITHUB_RUN_ID}"
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" && ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be a semantic X.Y.Z tag." >&2
            exit 1
          fi
          if [[ ${#families[@]} -eq 0 ]]; then
            echo 'families=[]' >> "$GITHUB_OUTPUT"
          else
            unique_families=$(printf '%s\n' "${families[@]}" | sort -u)
            family_json=$(printf '%s\n' "$unique_families" | python3 -c 'import json,sys; print(json.dumps([line.strip() for line in sys.stdin if line.strip()]))')
            echo "families=$family_json" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  publish:
    needs: detect
    if: needs.detect.outputs.families != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image_family: ${{ fromJSON(needs.detect.outputs.families) }}
    concurrency:
      group: publish-plugin-image-${{ matrix.image_family }}-${{ needs.detect.outputs.version }}
      cancel-in-progress: false
    steps:
      - name: Validate dispatch and resolve image context
        id: image
        env:
          IMAGE_FAMILY: ${{ matrix.image_family }}
          IMAGE_VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "Images may only be published from master." >&2
            exit 1
          fi
          if [[ ! "$IMAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be a semantic X.Y.Z tag." >&2
            exit 1
          fi
          case "$IMAGE_FAMILY" in
            oss-tools)
              image="docker.io/schiplat/buz-plugins-oss-tools"
              context="plugins/buz/oss-upload/image"
              ;;
            aws-tools)
              image="docker.io/schiplat/buz-plugins-aws-tools"
              context="plugins/buz/s3-upload/image"
              ;;
            *)
              echo "Unsupported image family." >&2
              exit 1
              ;;
          esac
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "context=$context" >> "$GITHUB_OUTPUT"
          echo "tag=$image:$IMAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$IMAGE_VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db # v3.6.1

      - name: Log in to Docker Hub
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Reject an existing image version tag
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          set -euo pipefail
          error_file=$(mktemp)
          trap 'rm -f "$error_file"' EXIT
          if docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>"$error_file"; then
            echo "Refusing to overwrite existing image tag $IMAGE:$VERSION" >&2
            exit 1
          fi
          if grep -Eiq 'manifest unknown|no such manifest|(^|: )not found($|[[:space:]])|status code: 404' "$error_file"; then
            echo "Image tag does not exist; continuing with $IMAGE:$VERSION"
          else
            echo "Could not determine whether image tag exists; refusing to publish." >&2
            cat "$error_file" >&2
            exit 1
          fi

      - name: Build and publish Linux x86_64 image
        id: build
        uses: docker/build-push-action@1ca370b3a9802c92e886402e0dd88098a2533b12 # v6.4.1
        with:
          context: ${{ steps.image.outputs.context }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tag }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=plugin-${{ matrix.image_family }}
          cache-to: type=gha,mode=max,scope=plugin-${{ matrix.image_family }}

      - name: Record published image digest
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Build action did not return an image digest." >&2
            exit 1
          fi
          echo "Published \\`${IMAGE}@${DIGEST}\\`" >> "$GITHUB_STEP_SUMMARY"
          echo "manifest_digest=${DIGEST}" >> "$GITHUB_OUTPUT"
