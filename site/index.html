<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Buz Step Library / Buz 插件库</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand-row">
      <div>
        <h1>Buz Step Library <span class="zh">Buz 插件库</span></h1>
        <p class="sub" data-i18n="tagline"></p>
      </div>
      <div class="head-actions">
        <button id="lang-toggle" class="lang-toggle" title="Switch language">EN / 中文</button>
        <input id="search" type="search" autocomplete="off" />
      </div>
    </div>
  </div>
</header>

<main class="wrap">
  <div id="banner" class="banner hidden"></div>
  <div class="list-meta"><span id="count"></span><span id="generated"></span></div>
  <div id="grid" class="grid"></div>
  <p id="empty" class="empty hidden"></p>
</main>

<footer class="wrap foot">
  <p>
    Contribute / 贡献: <a href="https://github.com/schiplat/buz-plugins" target="_blank" rel="noopener">schiplat/buz-plugins</a>
    · <a href="https://github.com/schiplat/buz-plugins/issues/new?template=report.yml" target="_blank" rel="noopener" data-i18n="report"></a>
    · <span data-i18n="security"></span>
  </p>
  <p class="fine" id="generated-line"></p>
</footer>

<dialog id="detail">
  <div class="detail-head">
    <div>
      <div class="mono strong" id="d-id"></div>
      <div class="badges" id="d-badges"></div>
    </div>
    <button id="d-close" class="icon" aria-label="close">✕</button>
  </div>
  <div id="d-body"></div>
</dialog>

<script src="app.js"></script>
</body>
</html>
