id: buz/setup-rust
category: build
name: Rust build environment (cargo)
version: 1.0.0
description: Run commands inside a pinned Rust toolchain. The image ships the stable toolchain; other X.Y toolchains install on demand via rustup.
publisher: official
author: "buz maintainers"
keywords: [rust, cargo, build, toolchain, rustup, 构建]
license: Apache-2.0
source_repo: https://github.com/schiplat/buz-plugins/blob/master/plugins/buz/setup-rust/1.0.0.yaml
engine: docker
image: docker.io/schiplat/buz-plugins-rust-tools:1.0.0
default_timeout: 30m
inputs:
  script:
    type: string
    required: true
    description: POSIX sh commands to run; executed with `set -e` from the selected workdir.
  version:
    type: string
    default: "stable"
    pattern: "^(stable|[0-9]+\\.[0-9]+)$"
    description: Toolchain selector. "stable" is built into the image; "X.Y" (for example 1.85) installs via rustup at run time.
  workdir:
    type: string
    default: "."
    description: Working directory relative to the workspace root.
  cache:
    type: boolean
    default: "false"
    description: Persist the cargo registry in <workspace>/.cache/rust/cargo across jobs on this Runner.
run: |
  set -eu

  : "${INPUT_SCRIPT:?script is required}"

  workdir="${INPUT_WORKDIR:-.}"
  case "$workdir" in
    /*|..|../*|*/../*|*/..)
      printf 'workdir must be a relative path inside the Buz workspace\n' >&2
      exit 2
      ;;
  esac
  cd /buz/workspace
  if [ "$workdir" != "." ]; then
    cd "$workdir"
  fi

  version="${INPUT_VERSION:-stable}"
  case "$version" in
    stable) ;;
    *)
      rustup toolchain install "$version" --profile minimal
      rustup default "$version"
      ;;
  esac

  if [ "${INPUT_CACHE:-false}" = "true" ]; then
    cargo_cache=/buz/workspace/.cache/rust/cargo
    mkdir -p "$cargo_cache"
    export CARGO_HOME="$cargo_cache"
    PATH="/usr/local/cargo/bin:$cargo_cache/bin:$PATH"
    export PATH
  fi

  script_file="${TMPDIR:-/tmp}/buz-setup-script"
  printf '%s\n' "$INPUT_SCRIPT" > "$script_file"
  sh -e "$script_file"
