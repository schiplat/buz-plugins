id: buz/setup-rust
category: build
name: Rust build environment (cargo)
version: 1.0.0
description: Run commands inside a pinned Rust toolchain. The image ships stable (Rust 1.99 at image 1.0.0); other X.Y toolchains and nightly install on demand via rustup.
publisher: official
author: "buz maintainers"
keywords: [rust, cargo, build, toolchain, rustup, 构建]
license: Apache-2.0
source_repo: https://github.com/schiplat/buz-plugins/blob/master/plugins/buz/setup-rust/1.0.0.yaml
engine: docker
requires_buz: ">=1.8.1"
image: docker.io/schiplat/rust@sha256:dbda8a25caaba00c0de8896127c7cd78e87577b5cea6958aed157c28cd7b1256
default_timeout: 30m
inputs:
  script:
    type: string
    required: true
    description: POSIX sh commands to run; executed with `set -e` from the selected workdir.
  version:
    type: string
    default: "stable"
    pattern: "^(stable|lts|dev|nightly|[0-9]+\\.[0-9]+)$"
    description: Toolchain selector. stable/lts use the image-built stable toolchain (Rust 1.99 at image 1.0.0); dev/nightly install the nightly channel via rustup at run time; X.Y (for example 1.85) installs that release via rustup.
  workdir:
    type: string
    default: "."
    description: Working directory relative to the workspace root.
  cache:
    type: boolean
    default: "false"
    description: Persist the cargo registry and on-demand rustup toolchains in <workspace>/.cache/rust across jobs on this Runner.
run: |
  set -eu

  : "${INPUT_SCRIPT:?script is required}"

  workdir="${INPUT_WORKDIR:-.}"
  case "$workdir" in
    /*|..|../*|*/../*|*/..)
      printf 'workdir must be a relative path inside the Buz workspace\n' >&2
      exit 2
      ;;
  esac
  cd /buz/workspace
  if [ "$workdir" != "." ]; then
    cd "$workdir"
  fi

  cache="${INPUT_CACHE:-false}"
  if [ "$cache" = "true" ]; then
    cargo_cache=/buz/workspace/.cache/rust/cargo
    mkdir -p "$cargo_cache"
    export CARGO_HOME="$cargo_cache"
    PATH="/usr/local/cargo/bin:$cargo_cache/bin:$PATH"
    export PATH
  fi

  version="${INPUT_VERSION:-stable}"
  case "$version" in
    stable|lts) ;;
    *)
      # persist on-demand toolchains so later jobs skip the download
      if [ "$cache" = "true" ]; then
        rustup_home=/buz/workspace/.cache/rust/rustup
        mkdir -p "$rustup_home"
        export RUSTUP_HOME="$rustup_home"
        PATH="/usr/local/cargo/bin:$PATH"
        export PATH
      fi
      case "$version" in
        dev|nightly) toolchain=nightly ;;
        *) toolchain="$version" ;;
      esac
      rustup toolchain install "$toolchain" --profile minimal
      rustup default "$toolchain"
      ;;
  esac
  rustc --version

  script_file="${TMPDIR:-/tmp}/buz-setup-script"
  printf '%s\n' "$INPUT_SCRIPT" > "$script_file"
  sh -e "$script_file"
