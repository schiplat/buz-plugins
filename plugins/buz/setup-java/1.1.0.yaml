id: buz/setup-java
category: build
name: Java build environment (Temurin JDK)
version: 1.1.0
description: "Prepare a pinned Temurin JDK (21, 25, or 17) with JAVA_HOME exported for the step's run: commands. Maven users can add -Dmaven.repo.local to share the local repository via the cache."
description_zh: "为步骤的 run: 命令准备固定的 Temurin JDK（21、25 或 17），导出 JAVA_HOME。Maven 用户可通过 cache 共享本地仓库（-Dmaven.repo.local）。"
publisher: official
author: "buz maintainers"
keywords: [java, jdk, temurin, maven, gradle, build, toolchain, environment, 构建, 环境]
license: Apache-2.0
source_repo: https://github.com/schiplat/buz-plugins/blob/master/plugins/buz/setup-java/1.1.0.yaml
engine: docker
image: docker.io/schiplat/java@sha256:535ba394b8be62a5059b454321aaa21827d53f864cc8bc838d1b8a58581e1240
default_timeout: 30m
default_dir: source
requires_buz: ">=1.8.0"
inputs:
  version:
    type: choice
    default: "stable"
    options: [stable, lts, dev, 21, 25, 17]
    description: Temurin JDK version. stable/lts select 21; dev selects 25 (newest LTS).
  cache:
    type: boolean
    default: "false"
    description: Persist build-tool caches in <workspace>/.cache/java (Gradle via GRADLE_USER_HOME; for Maven pass -Dmaven.repo.local=/buz/workspace/.cache/java/m2).
run: |
  set -e

  # Harness template: Buz appends the step's run: after this block in the same
  # shell, so everything exported here (JAVA_HOME, GRADLE_USER_HOME, …) is
  # visible to the caller's commands. The engine already chdirs into the step
  # directory (step-level work_dir, else the default_dir above) — never cd
  # away from it.
  version="${INPUT_VERSION:-stable}"
  case "$version" in
    stable|lts|21)
      JAVA_HOME=/opt/java/openjdk
      ;;
    25|dev)
      JAVA_HOME=/opt/java/25
      ;;
    17)
      JAVA_HOME=/opt/java/17
      ;;
    *)
      printf 'unsupported java version: %s\n' "$version" >&2
      exit 2
      ;;
  esac
  export JAVA_HOME
  PATH="$JAVA_HOME/bin:$PATH"
  export PATH
  java -version

  if [ "${INPUT_CACHE:-false}" = "true" ]; then
    java_cache=/buz/workspace/.cache/java
    mkdir -p "$java_cache/gradle"
    export GRADLE_USER_HOME="$java_cache/gradle"
  fi
