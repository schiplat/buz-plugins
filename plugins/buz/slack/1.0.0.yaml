id: buz/slack
category: notifications
name: Slack incoming-webhook notification
version: 1.0.0
description: Post a message to a Slack channel via an incoming webhook; auto-appends the Buz job link.
description_zh: 通过 Slack incoming webhook 发送消息，自动附带 Buz 任务链接。
publisher: official
author: "buz maintainers"
keywords: [slack, notify, notification, webhook]
license: Apache-2.0
source_repo: https://github.com/schiplat/buz-plugins/blob/master/plugins/buz/slack/1.0.0.yaml
engine: shell
default_timeout: 30s
requires_buz: ">=1.8.1"
inputs:
  webhook:
    type: string
    required: true
    masking: true
    description: Slack incoming webhook URL (https://hooks.slack.com/services/...)
  title:
    type: string
    default: Buz job notification
  content:
    type: string
    default: ""
run: |
  set -e
  TEXT="${INPUT_TITLE:-Buz job notification}"
  if [ -n "${INPUT_CONTENT:-}" ]; then
    TEXT="${TEXT}
  ${INPUT_CONTENT}"
  fi
  if [ -n "${BUZ_PIPELINE_NAME:-}" ]; then
    TEXT="${TEXT}
  Pipeline: ${BUZ_PIPELINE_NAME}"
  fi
  if [ -n "${BUZ_JOB_URL:-}" ]; then
    TEXT="${TEXT}
  ${BUZ_JOB_URL}"
  fi
  ESCAPED=$(printf '%s' "$TEXT" | sed 's/\\/\\\\/g; s/"/\\"/g')
  PAYLOAD=$(printf '{"text":"%s"}' "$ESCAPED")
  curl -fsSL -X POST "$INPUT_WEBHOOK" \
    -H 'Content-Type: application/json' -d "$PAYLOAD" >/dev/null
