id: buz/docker-login-remote
category: deploy
name: Docker registry login on target hosts
version: 1.0.0
description: "Log the Docker CLI into a registry on the deploy target hosts — engine ssh, set the step-level `host:` list. Later ssh steps on the same hosts can pull private images (e.g. docker compose pull). Credentials land in a job-scoped config dir under /tmp on each host; pair with buz/docker-logout-remote as the last step. Requires the Docker CLI on the target hosts."
description_zh: "在部署目标主机上登录容器镜像仓库——engine ssh，通过步骤级 host: 指定主机列表，供后续 ssh 步骤拉取私有镜像（如 docker compose pull）。凭证写入各目标机 /tmp 下 job 级目录；最后用 buz/docker-logout-remote 收尾。需要目标机装有 Docker CLI。"
publisher: official
author: "buz maintainers"
keywords: [docker, login, registry, ssh, remote, deploy, 登录, 镜像仓库]
license: Apache-2.0
source_repo: https://github.com/schiplat/buz-plugins/blob/master/plugins/buz-docker-login-remote.yaml
engine: ssh
default_timeout: 2m
inputs:
  registry:
    type: string
    required: true
    description: Registry host (e.g. registry.example.com); multiple registries → one step each
  username:
    type: string
    required: true
  password:
    type: string
    required: true
    masking: true
    description: Password or access token — delivered via --password-stdin, never a CLI argument
run: |
  set -eu
  : "${INPUT_REGISTRY:?registry is required}"
  : "${INPUT_USERNAME:?username is required}"
  : "${INPUT_PASSWORD:?password is required}"
  printf '%s\n' "$INPUT_PASSWORD" | docker login --username "$INPUT_USERNAME" --password-stdin "$INPUT_REGISTRY"
  printf 'docker login ok on %s: %s (config dir: %s)\n' \
    "$(hostname)" "$INPUT_REGISTRY" "${DOCKER_CONFIG:-$HOME/.docker}"
