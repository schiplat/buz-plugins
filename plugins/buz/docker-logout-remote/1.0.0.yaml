id: buz/docker-logout-remote
category: deploy
name: Docker registry logout on target hosts
version: 1.0.0
description: "Best-effort `docker logout` on the deploy target hosts (engine ssh — set the step-level `host:` list) and removes the job-scoped credential dir under /tmp. Pair with buz/docker-login-remote as the last step; mark earlier failure-prone steps `continue-on-error` so this still runs (a cancelled job cannot run it — remote residue then waits for the host's /tmp cleanup)."
description_zh: "在部署目标主机上尽力执行的 docker logout（engine ssh，通过步骤级 host: 指定主机列表），并清理 /tmp 下 job 级凭证目录。与 buz/docker-login-remote 配对、作为最后一步；建议给前面的易失败步骤加 continue-on-error 保证收尾可执行（job 被取消时收尾步不会执行，残留待目标机 /tmp 清理机制回收）。"
publisher: official
author: "buz maintainers"
keywords: [docker, logout, registry, ssh, cleanup, 登出, 清理]
license: Apache-2.0
source_repo: https://github.com/schiplat/buz-plugins/blob/master/plugins/buz-docker-logout-remote.yaml
engine: ssh
default_timeout: 2m
inputs:
  registry:
    type: string
    required: true
    description: Registry host to log out from (same value as the login step)
run: |
  set -eu
  : "${INPUT_REGISTRY:?registry is required}"
  if docker logout "$INPUT_REGISTRY" 2>/dev/null; then
    printf 'docker logout ok on %s: %s\n' "$(hostname)" "$INPUT_REGISTRY"
  else
    printf 'docker logout on %s: not logged in to %s (nothing to clean)\n' \
      "$(hostname)" "$INPUT_REGISTRY"
  fi
  # Remove the job-scoped config dir this session used (guarded: never rm -rf
  # an unset or host-global DOCKER_CONFIG).
  case "${DOCKER_CONFIG:-}" in
    /tmp/buz-docker-*) rm -rf "$DOCKER_CONFIG" ;;
  esac
