id: buz/setup-ruby
category: build
name: Ruby build environment (gem/bundler)
version: 1.0.0
description: Run commands inside a pinned Ruby toolchain (3.4 or 3.3). 3.3 is EOL upstream and kept for existing applications.
publisher: official
author: "buz maintainers"
keywords: [ruby, gem, bundler, build, toolchain, 构建]
license: Apache-2.0
source_repo: https://github.com/schiplat/buz-plugins/blob/master/plugins/buz/setup-ruby/1.0.0.yaml
engine: docker
image: docker.io/schiplat/buz-plugins-ruby-tools:1.0.0
default_timeout: 30m
inputs:
  script:
    type: string
    required: true
    description: POSIX sh commands to run; executed with `set -e` from the selected workdir.
  version:
    type: choice
    default: "3.4"
    options: [3.4, 3.3]
    description: Ruby toolchain version.
  workdir:
    type: string
    default: "."
    description: Working directory relative to the workspace root.
  cache:
    type: boolean
    default: "false"
    description: Persist gem/bundler caches in <workspace>/.cache/ruby across jobs on this Runner.
run: |
  set -eu

  : "${INPUT_SCRIPT:?script is required}"

  workdir="${INPUT_WORKDIR:-.}"
  case "$workdir" in
    /*|..|../*|*/../*|*/..)
      printf 'workdir must be a relative path inside the Buz workspace\n' >&2
      exit 2
      ;;
  esac
  cd /buz/workspace
  if [ "$workdir" != "." ]; then
    cd "$workdir"
  fi

  version="${INPUT_VERSION:-3.4}"
  case "$version" in
    3.4) ;;
    3.3)
      PATH="/opt/ruby/3.3/bin:$PATH"
      export PATH
      ;;
    *)
      printf 'unsupported ruby version: %s\n' "$version" >&2
      exit 2
      ;;
  esac

  if [ "${INPUT_CACHE:-false}" = "true" ]; then
    ruby_cache=/buz/workspace/.cache/ruby
    mkdir -p "$ruby_cache/gems" "$ruby_cache/bundle"
    export GEM_HOME="$ruby_cache/gems"
    export BUNDLE_PATH="$ruby_cache/bundle"
  fi

  script_file="${TMPDIR:-/tmp}/buz-setup-script"
  printf '%s\n' "$INPUT_SCRIPT" > "$script_file"
  sh -e "$script_file"
