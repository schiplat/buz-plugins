id: buz/setup-php
category: build
name: PHP build environment (composer)
version: 1.1.0
description: "Prepare a pinned PHP toolchain (8.4 or 8.3) with Composer for the step's run: commands."
description_zh: "为步骤的 run: 命令准备固定的 PHP 工具链（8.4 或 8.3），内置 Composer。"
publisher: official
author: "buz maintainers"
keywords: [php, composer, build, toolchain, environment, 构建, 环境]
license: Apache-2.0
source_repo: https://github.com/schiplat/buz-plugins/blob/master/plugins/buz/setup-php/1.1.0.yaml
engine: docker
image: docker.io/schiplat/php@sha256:7edc598ff77ae867fb529866c257f1e19682eb57908596879ab60330f55a1d63
default_timeout: 30m
default_dir: source
requires_buz: ">=1.8.1"
inputs:
  version:
    type: choice
    default: "stable"
    options: [stable, lts, dev, 8.4, 8.3]
    description: PHP version. stable/lts/dev all select 8.4 (no distinct LTS or dev line in this image); 8.3 is the previous line.
  cache:
    type: boolean
    default: "false"
    description: Persist the Composer cache in <workspace>/.cache/php across jobs on this Runner.
run: |
  set -e

  # Harness template: Buz appends the step's run: after this block in the same
  # shell, so everything exported here (PATH, PHPRC, COMPOSER_HOME, …) is
  # visible to the caller's commands. The engine already chdirs into the step
  # directory (step-level work_dir, else the default_dir above) — never cd
  # away from it.
  version="${INPUT_VERSION:-stable}"
  case "$version" in
    stable|lts|dev|8.4) ;;
    8.3)
      PATH="/opt/php/8.3/bin:$PATH"
      export PATH
      PHPRC=/opt/php/8.3/etc/php.ini
      export PHPRC
      ;;
    *)
      printf 'unsupported php version: %s\n' "$version" >&2
      exit 2
      ;;
  esac
  php --version

  if [ "${INPUT_CACHE:-false}" = "true" ]; then
    composer_home=/buz/workspace/.cache/php/composer
    mkdir -p "$composer_home"
    export COMPOSER_HOME="$composer_home"
    export COMPOSER_CACHE_DIR="$composer_home/cache"
  fi
