id: buz/config-fetch-remote
category: source
name: Fetch config bundle on target hosts
version: 1.0.0
description: "Download a configuration bundle (tar.gz) on the deploy target hosts and unpack it — engine ssh, set the step-level `host:` list. Typically a presigned object-storage URL (OSS / S3 / MinIO / R2); the target host pulls directly, so it needs egress to the storage endpoint. Requires curl and tar on the target hosts."
description_zh: "在部署目标主机上下载配置包（tar.gz）并解包——engine ssh，通过步骤级 host: 指定主机列表。通常使用对象存储预签名 URL（OSS / S3 / MinIO / R2 通用），由目标机直接拉取，需目标机出网可达存储端点。需要目标机装有 curl 和 tar。"
publisher: official
author: "buz maintainers"
keywords: [config, fetch, ssh, remote, presigned, oss, s3, minio, r2, 配置, 下载]
license: Apache-2.0
source_repo: https://github.com/schiplat/buz-plugins/blob/master/plugins/buz-config-fetch-remote.yaml
engine: ssh
default_timeout: 10m
inputs:
  url:
    type: string
    required: true
    masking: true
    description: HTTPS URL of a .tar.gz bundle — presigned object-storage URLs keep bucket credentials out of the pipeline entirely
  dest:
    type: string
    required: true
    description: Absolute directory on the target host to unpack into (created as needed; relative paths are rejected)
  strip_components:
    type: number
    default: "0"
    description: Remove leading path components when unpacking (tar --strip-components)
  max_time:
    type: number
    default: "540"
    description: Download timeout in seconds (curl --max-time; stays under the 10m step timeout)
run: |
  set -eu
  : "${INPUT_URL:?url is required}"
  : "${INPUT_DEST:?dest is required}"
  case "$INPUT_DEST" in
    /*) ;;
    *)
      printf 'dest must be an absolute path on the target host (for example /opt/app)\n' >&2
      exit 2
      ;;
  esac
  mkdir -p "$INPUT_DEST"
  tmp="$(mktemp /tmp/buz-config-fetch.XXXXXX)"
  trap 'rm -f "$tmp"' EXIT
  curl -fsSL --retry 2 --max-time "${INPUT_MAX_TIME:-540}" -o "$tmp" "$INPUT_URL"
  if [ "${INPUT_STRIP_COMPONENTS:-0}" != "0" ]; then
    tar -xzf "$tmp" --strip-components="$INPUT_STRIP_COMPONENTS" -C "$INPUT_DEST"
  else
    tar -xzf "$tmp" -C "$INPUT_DEST"
  fi
  printf 'config bundle unpacked to %s on %s (%s bytes downloaded)\n' \
    "$INPUT_DEST" "$(hostname)" "$(wc -c < "$tmp" | tr -d ' ')"
