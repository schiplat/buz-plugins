id: buz/setup-lua
category: build
name: Lua runtime (5.4/5.3/LuaJIT)
version: 1.1.0
description: "Prepare a pinned Lua interpreter for the step's run: commands — lua 5.4, lua 5.3, or LuaJIT 2.1, all Debian-packaged."
description_zh: "为步骤的 run: 命令准备固定的 Lua 解释器——lua 5.4、lua 5.3 或 LuaJIT 2.1，均为 Debian 官方包。"
publisher: official
author: "buz maintainers"
keywords: [lua, luajit, build, toolchain, environment, 构建, 环境]
license: Apache-2.0
source_repo: https://github.com/schiplat/buz-plugins/blob/master/plugins/buz/setup-lua/1.1.0.yaml
engine: docker
image: docker.io/schiplat/lua@sha256:8f1a0f1d5a0e542039484d1918fe75b8a8b378bd330ef1888fe5e6bdf6bdf1e3
default_timeout: 30m
default_dir: source
requires_buz: ">=1.8.1"
inputs:
  version:
    type: choice
    default: "stable"
    options: [stable, lts, dev, 5.4, 5.3, jit]
    description: Lua interpreter (jit selects LuaJIT 2.1). stable/lts/dev all select 5.4 (Lua has no LTS or dev channel in this image).
run: |
  set -e

  # Harness template: Buz appends the step's run: after this block in the same
  # shell, so the interpreter PATH exported here is visible to the caller's
  # commands. The engine already chdirs into the step directory (step-level
  # work_dir, else the default_dir above) — never cd away from it.
  version="${INPUT_VERSION:-stable}"
  case "$version" in
    stable|lts|dev|5.4)
      PATH="/opt/lua/5.4/bin:$PATH"
      export PATH
      ;;
    5.3|jit)
      PATH="/opt/lua/$version/bin:$PATH"
      export PATH
      ;;
    *)
      printf 'unsupported lua version: %s\n' "$version" >&2
      exit 2
      ;;
  esac
  if [ "$version" = "jit" ]; then luajit -v; else lua -v; fi
