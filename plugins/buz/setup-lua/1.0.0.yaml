id: buz/setup-lua
category: build
name: Lua runtime (5.4/5.3/LuaJIT)
version: 1.0.0
description: Run commands with a pinned Lua interpreter — lua 5.4, lua 5.3, or LuaJIT 2.1, all Debian-packaged.
publisher: official
author: "buz maintainers"
keywords: [lua, luajit, build, toolchain, 构建]
license: Apache-2.0
source_repo: https://github.com/schiplat/buz-plugins/blob/master/plugins/buz/setup-lua/1.0.0.yaml
engine: docker
image: docker.io/schiplat/lua@sha256:8f1a0f1d5a0e542039484d1918fe75b8a8b378bd330ef1888fe5e6bdf6bdf1e3
default_timeout: 30m
inputs:
  script:
    type: string
    required: true
    description: POSIX sh commands to run; executed with `set -e` from the selected workdir.
  version:
    type: choice
    default: "stable"
    options: [stable, lts, dev, 5.4, 5.3, jit]
    description: Lua interpreter (jit selects LuaJIT 2.1). stable/lts/dev all select 5.4 (Lua has no LTS or dev channel in this image).
  workdir:
    type: string
    default: "."
    description: Working directory relative to the workspace root.
run: |
  set -eu

  : "${INPUT_SCRIPT:?script is required}"

  workdir="${INPUT_WORKDIR:-.}"
  case "$workdir" in
    /*|..|../*|*/../*|*/..)
      printf 'workdir must be a relative path inside the Buz workspace\n' >&2
      exit 2
      ;;
  esac
  cd /buz/workspace
  if [ "$workdir" != "." ]; then
    cd "$workdir"
  fi

  version="${INPUT_VERSION:-stable}"
  case "$version" in
    stable|lts|dev|5.4)
      PATH="/opt/lua/5.4/bin:$PATH"
      export PATH
      ;;
    5.3|jit)
      PATH="/opt/lua/$version/bin:$PATH"
      export PATH
      ;;
    *)
      printf 'unsupported lua version: %s\n' "$version" >&2
      exit 2
      ;;
  esac
  if [ "$version" = "jit" ]; then luajit -v; else lua -v; fi

  script_file="${TMPDIR:-/tmp}/buz-setup-script"
  printf '%s\n' "$INPUT_SCRIPT" > "$script_file"
  sh -e "$script_file"
