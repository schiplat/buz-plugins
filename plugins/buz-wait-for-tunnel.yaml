id: buz/net/wait-for-tunnel
name: Wait for a tunnel / TCP endpoint
version: 1.0.0
description: Block until a TCP endpoint (frp/rp/ssh tunnel, migrated service…) accepts connections, or fail after the timeout.
description_zh: 等待 TCP 端点（frp/rp 隧道、迁移中的服务…）可连通，超时则失败——跨网络发布场景的同步原语。
publisher: official
author: "buz maintainers"
keywords: [tunnel, tcp, frp, wait, network, 隧道, 内网穿透]
license: Apache-2.0
source_repo: https://github.com/schiplat/buz-plugins/blob/master/plugins/buz-wait-for-tunnel.yaml
engine: shell
default_timeout: 10m
inputs:
  host:
    type: string
    required: true
    description: Target hostname or IP
  port:
    type: number
    required: true
    description: Target TCP port
  interval:
    type: string
    default: 5s
    description: Sleep between attempts
  attempts:
    type: number
    default: "60"
    description: Total attempts before failing
run: |
  set -e
  i=1
  while [ "$i" -le "${INPUT_ATTEMPTS:-60}" ]; do
    if nc -z -w 5 "$INPUT_HOST" "$INPUT_PORT" 2>/dev/null; then
      printf 'tunnel up after %s attempt(s): %s:%s\n' "$i" "$INPUT_HOST" "$INPUT_PORT"
      exit 0
    fi
    printf 'attempt %s/%s: %s:%s not reachable yet\n' "$i" "${INPUT_ATTEMPTS:-60}" "$INPUT_HOST" "$INPUT_PORT"
    sleep "${INPUT_INTERVAL:-5s}"
    i=$((i + 1))
  done
  printf 'tunnel never came up: %s:%s after %s attempts\n' \
    "$INPUT_HOST" "$INPUT_PORT" "${INPUT_ATTEMPTS:-60}" >&2
  exit 1
